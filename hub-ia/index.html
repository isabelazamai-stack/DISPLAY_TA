<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @Média</title>
     <!-- <link rel="stylesheet" href="./css/style.css"> -->

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body{
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Arial, sans-serif;
            height: 300vh;
        }

        h1{
            text-align: center;
            margin-top: 20px;
        }

        .container{
            width: 100%;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;

        }

        .box{
            width: 400px;
            max-width: 400px;
            height: 200px;
            background-color: black;
            
        }


        .container-position{
            margin-top: 10px;
            width: 100%;
            height: 600px;
            border: 2px solid white;
            position: relative;
        }

        .filho-tamanho{
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: rgb(255, 255, 255);
            
        }

        .container-position__filho01{
            top: 0;
            left: 0;
        }

        .container-position__filho02{
            top: 0;
            right: 0;
        }

        .container-position__filho03{
            bottom: 0;
            left: 0;
        }

        .container-position__filho04{
            bottom: 0;
            right: 0;
        }

        .whats{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(99, 209, 36);
            border: 2px solid #fff;
            box-shadow: 1px 2px 2px #fff;
            position: fixed;
            right: 0;
            bottom: 0;
        }


        @media(min-width: 768px) {
            body {
                background-color: blue;
                color: white;
            }
            .box{
                width: 349px;
            }}

        @media (min-width: 992px) {
            body {
                background-color: tan;
                color: black;
            }
            .box{
                width: 300px;
            }}


    </style>
</head>
<body>
    <h1>Testes com CSS @Media Query</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">
        <div class="container-position__filho01 filho-tamanho"></div>
        <div class="container-position__filho02 filho-tamanho"></div>
        <div class="container-position__filho03 filho-tamanho"></div>
        <div class="container-position__filho04 filho-tamanho"></div>
    </div>

    <div class="whats"></div>
</body>
</html>
