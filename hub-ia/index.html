<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @Média</title>
     <!-- <link rel="stylesheet" href="./css/style.css"> -->

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body{
            padding: 20px;
            background-color: rgb(221, 171, 255);
            color: white;
            font-family: Arial, sans-serif;
        }

        h1{
            text-align: center;
            margin-top: 20px;
        }

        .container{
            width: 100%;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .box{
            width: 400px;
            max-width: 400px;
            height: 200px;
            background-color: black;
        }

        @media(min-width: 768px){
            body{
                background-color: rgb(255, 7, 160) ;
            }}
        
        @media(max-width: 480px) {
            body {
                background-color: rgb(206, 255, 174);
            }}


    </style>
</head>
<body>
    <h1>Testes com CSS @Media Query</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
